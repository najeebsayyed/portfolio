<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Subtle Radial Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#accentGrad)" opacity="0.15" />

  <!-- Code Bracket < /> Graphic -->
  <path
    d="M 22 22 L 13 32 L 22 42"
    stroke="url(#accentGrad)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  
  <path
    d="M 42 22 L 51 32 L 42 42"
    stroke="url(#accentGrad)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <line
    x1="36"
    y1="20"
    x2="28"
    y2="44"
    stroke="#38bdf8"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Top Right Glowing AI Sparkle -->
  <circle cx="48" cy="16" r="3" fill="#a855f7" />
</svg>